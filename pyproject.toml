[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "messpy"
dynamic = ["version"]
description = "Mess detector for Python."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
fuzz = ["atheris>=2.3.0,<3"]

[project.scripts]
messpy = "messpy.cli:main"

[tool.hatch.version]
path = "src/messpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/messpy"]
