name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run integration and installed-package acceptance
        run: python -m unittest discover -s tests

  distribution:
    name: Build, inspect, install, and self-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Verify generated rule documentation
        run: python scripts/generate_rule_docs.py --check
      - name: Build publication artifacts
        run: |
          python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
          python scripts/inspect_distribution.py dist
      - name: Install only the freshly built wheel
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
      - name: Verify installed-command self-analysis against the strict debt baseline
        run: python scripts/verify_self_analysis.py .artifact-venv/bin/messpy ci/self-analysis-baseline.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: messpy-distributions
          path: dist/*
