name: Release standalone executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate stable tag and source
    runs-on: ubuntu-latest
    outputs:
      immutable_release: ${{ steps.release.outputs['immutable-release'] }}
      source_sha: ${{ steps.release.outputs['source-sha'] }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: release
        name: Validate the stable release identity
        uses: quality-gates/homebrew-tap/.github/actions/validate-source-release@0076a679dc5f6ee0ef6e28f571b24fc3ec973ae2
        with:
          tool: messpy
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}

      - name: Require the default-branch package version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ steps.release.outputs['source-sha'] }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          VERSION="$VERSION" PYTHONPATH=src python -c \
            'import os; from messpy import __version__; assert __version__ == os.environ["VERSION"]'


  test:
    name: Test release source
    needs: validate
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run the complete test suite
        run: python -m unittest discover -s tests
      - name: Verify generated docs and self-analysis
        run: |
          python scripts/generate_rule_docs.py --check
          python -m pip install --disable-pip-version-check --no-deps .
          python scripts/verify_self_analysis.py messpy

  build:
    name: Build darwin/${{ matrix.arch }}
    needs: [validate, test]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: macos-15-intel
          - arch: arm64
            machine: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the hash-pinned standalone build toolchain
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r ci/pyinstaller-requirements-macos.txt
      - name: Build and package the native executable
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACHINE"
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          python -m PyInstaller \
            --clean --noconfirm --onefile --name messpy \
            --paths src --target-arch "$MACHINE" \
            scripts/messpy_standalone.py
          test "$(lipo -archs dist/messpy)" = "$MACHINE"
          codesign --verify --strict dist/messpy
          test "$(dist/messpy --version)" = "$VERSION"
          mkdir package
          python scripts/package_standalone.py \
            dist/messpy LICENSE package "$VERSION" "$ARCH" "$source_date_epoch"
          python scripts/inspect_standalone_archive.py \
            "package/messpy_${VERSION}_darwin_${ARCH}.tar.gz" "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: messpy-darwin-${{ matrix.arch }}
          path: package/*.tar.gz
          retention-days: 7

  package:
    name: Collect exact release assets
    needs: [validate, build]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          merge-multiple: true
          path: dist
          pattern: messpy-darwin-*
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum messpy_*.tar.gz | LC_ALL=C sort > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: release-assets
          path: dist/*
          retention-days: 7

  smoke:
    name: Test exact archive on ${{ matrix.runner }}
    needs: [validate, package]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: macos-15-intel
          - arch: arm64
            machine: arm64
            runner: macos-15
          - arch: amd64
            machine: x86_64
            runner: macos-26-intel
          - arch: arm64
            machine: arm64
            runner: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-assets
          path: dist
      - name: Exercise the packaged executable
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACHINE"
          (cd dist && shasum -a 256 -c checksums.txt)
          archive="dist/messpy_${VERSION}_darwin_${ARCH}.tar.gz"
          python scripts/inspect_standalone_archive.py "$archive" "$VERSION" "$ARCH"
          mkdir "$RUNNER_TEMP/messpy-package"
          tar -xzf "$archive" -C "$RUNNER_TEMP/messpy-package"
          executable="$RUNNER_TEMP/messpy-package/messpy"
          test "$(lipo -archs "$executable")" = "$MACHINE"
          codesign --verify --strict "$executable"
          test "$("$executable" --version)" = "$VERSION"
          "$executable" tests/fixtures/clean.py text codesize
          set +e
          "$executable" tests/fixtures/long_function.py json codesize > "$RUNNER_TEMP/finding.json"
          finding_status=$?
          printf 'def broken(:\n' > "$RUNNER_TEMP/malformed.py"
          "$executable" "$RUNNER_TEMP/malformed.py" text codesize > "$RUNNER_TEMP/error.txt"
          error_status=$?
          set -e
          test "$finding_status" = 2
          test "$error_status" = 1
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tool"]["version"])' "$RUNNER_TEMP/finding.json")" = "$VERSION"
          grep -Fq ExcessiveMethodLength "$RUNNER_TEMP/finding.json"
          grep -Fq malformed.py "$RUNNER_TEMP/error.txt"

  publish:
    name: Publish the immutable release and Homebrew formula
    needs: [validate, smoke]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.validate.outputs.immutable_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: homebrew
    permissions:
      contents: write
    steps:
      - uses: quality-gates/homebrew-tap/.github/actions/publish-source-release@0076a679dc5f6ee0ef6e28f571b24fc3ec973ae2
        with:
          tool: messpy
          tag: ${{ env.TAG }}
          version: ${{ needs.validate.outputs.version }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
          immutable-release: ${{ needs.validate.outputs.immutable_release }}
          github-token: ${{ github.token }}
          tap-app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          tap-app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
